[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bessopt"
version = "0.1.0"
description = "Day-ahead bidding and dispatch of a grid-scale battery in Swedish bidding zone SE4"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.6",
    "highspy>=1.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "entsoe-py>=0.6",
    "holidays>=0.50",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gurobi = ["gurobipy>=11"]
dev = ["pytest>=8", "ruff>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit external APIs (deselect with -m 'not network')"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E731"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclass, safe as a default argument
extend-immutable-calls = ["bessopt.config.BatterySpec"]
