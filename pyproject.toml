[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bessopt"
version = "0.1.0"
description = "Day-ahead bidding and dispatch of a grid-scale battery in Swedish bidding zone SE4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.6",
    "highspy>=1.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "entsoe-py>=0.6",
    "holidays>=0.50",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gurobi = ["gurobipy>=11"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit external APIs (deselect with -m 'not network')"]
